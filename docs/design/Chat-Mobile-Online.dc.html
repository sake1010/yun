<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>線上名單展開、斷線、送太快</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
.app{--bg:#F3F6F8;--surface:#FFFFFF;--surface2:#E8EEF2;--text:#17212B;--muted:#56626E;--line:#C9D2DA;--accent:#0B7480;--accent-ink:#FFFFFF;--mine:#0B7480;--mine-ink:#FFFFFF;--warn:#A8201A;--warn-bg:#FCE9E7;--c1:#B3261E;--c2:#8A5A00;--c3:#1B7F3B;--c4:#1F5FBF;--c5:#8E3FBF;--c6:#B0306E;position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Noto Sans SC','Noto Sans KR','Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.5}
.app.dark{--bg:#0E1418;--surface:#172028;--surface2:#212C35;--text:#E6EDF2;--muted:#9AA8B4;--line:#2E3B47;--accent:#4CC9D4;--accent-ink:#06262A;--mine:#116069;--mine-ink:#FFFFFF;--warn:#FFB4AB;--warn-bg:#3B1F1D;--c1:#FF8A80;--c2:#F2B94B;--c3:#5FD38A;--c4:#7CAEFF;--c5:#C79BFF;--c6:#FF8FC0}
.app *{box-sizing:border-box}
.app button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.app button:focus-visible,.app textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app svg{display:block;flex:none}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}.c6{color:var(--c6)}
.ibtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.sbtn{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.sbtn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-direction:column;max-width:84%}
.row.other{align-self:flex-start;align-items:flex-start}
.row.mine{align-self:flex-end;align-items:flex-end}
.meta{display:flex;gap:8px;align-items:baseline;font-size:13px;margin:0 4px 3px}
.name{font-weight:700}
.time{color:var(--muted);font-size:12px}
.bubble{padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.row.other .bubble{border-top-left-radius:6px}
.row.mine .bubble{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-bottom-right-radius:6px}
.field{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;padding:11px 14px;resize:none}
.person{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:16px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c3)}
</style>
</helmet>
<div class="app {{theme}}" style="width:390px;height:844px;display:flex;flex-direction:column">
  <div style="height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted);font-size:12px">示範模式・對話對象為模擬</div>

  <div style="height:64px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)">
    <button type="button" aria-expanded="true" aria-label="收合線上名單" style="flex:1;min-width:0;height:48px;display:flex;align-items:center;gap:10px;text-align:left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>
      <span style="min-width:0;display:flex;flex-direction:column">
        <span style="font-weight:800;line-height:1.25">線上 4 人</span>
        <span style="font-size:12px;color:var(--muted)">點一下收合</span>
      </span>
    </button>
    <button type="button" class="ibtn" aria-label="切換介面語言" style="width:44px;height:44px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
    </button>
  </div>

  <div role="alert" style="min-height:44px;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:14px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    連線中斷，重新連線中…
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:16px">
    <div class="row other">
      <div class="meta"><span class="name c4">小華</span><span class="time">14:40</span></div>
      <div class="bubble">我先去吃飯，晚點回來聊。</div>
    </div>
    <div class="row mine">
      <div class="meta"><span class="time">14:41</span><span class="name c2">阿森</span></div>
      <div class="bubble">好喔，慢慢吃。</div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:92px;bottom:0;background:rgba(8,14,20,.45)" aria-hidden="true"></div>

  <div role="dialog" aria-label="線上名單" style="position:absolute;left:12px;right:12px;top:100px;padding:6px 0 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 16px 40px rgba(8,14,20,.3)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px 16px">
      <div style="font-weight:800;font-size:17px">線上 4 人</div>
      <button type="button" class="ibtn" style="width:44px;height:44px;border:0" aria-label="關閉名單">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="person"><span class="dot"></span><span class="c2">阿森</span><span style="color:var(--muted);font-weight:500">（你）</span></div>
    <div class="person"><span class="dot"></span><span class="c4">小華</span></div>
    <div class="person"><span class="dot"></span><span class="c5">Amy</span></div>
    <div class="person"><span class="dot"></span><span class="c6">小美</span></div>
  </div>

  <div style="height:28px;padding:0 16px;display:flex;align-items:center;gap:8px;color:var(--warn);font-size:13px;font-weight:700" role="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    送太快了，請稍等
  </div>
  <div style="display:flex;align-items:flex-end;gap:8px;padding:6px 12px 14px;background:var(--surface);border-top:1px solid var(--line)">
    <button type="button" class="ibtn" aria-label="附加圖片或檔案">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
    </button>
    <label for="msg" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">訊息內容</label>
    <textarea id="msg" class="field" rows="1">哈哈哈哈哈</textarea>
    <button type="button" class="sbtn" disabled aria-label="送出訊息（暫時停用）">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"外觀"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
