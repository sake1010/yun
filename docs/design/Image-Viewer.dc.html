<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖片放大檢視</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
.viewer{position:relative;overflow:hidden;box-sizing:border-box;background:#070B0F;color:#F1F5F8;font-family:'Noto Sans TC','Noto Sans SC','Noto Sans KR','Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.5}
.viewer *{box-sizing:border-box}
.viewer button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.viewer button:focus-visible{outline:2px solid #4CC9D4;outline-offset:2px}
.viewer svg{display:block;flex:none}
</style>
</helmet>
<div class="viewer" style="width:390px;height:844px;display:flex;flex-direction:column" role="dialog" aria-modal="true" aria-label="圖片放大檢視">
  <div style="height:72px;padding:12px 12px 0;display:flex;align-items:center;gap:8px">
    <button type="button" aria-label="關閉" style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div style="flex:1;min-width:0;text-align:center;line-height:1.3">
      <div style="font-weight:700">小華</div>
      <div style="font-size:12px;color:#A9B6C1">14:30</div>
    </div>
    <div style="width:48px"></div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="width:100%;aspect-ratio:4/3;border-radius:12px;background:#17222B;border:1px solid #2A3946;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#A9B6C1;font-size:14px">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      <span>圖片（原尺寸）</span>
    </div>
  </div>

  <div style="padding:12px 16px 24px">
    <button type="button" style="width:100%;height:52px;border-radius:14px;background:#4CC9D4;color:#06262A;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      下載原圖（1.8 MB）
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
