<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>聊天室（電腦）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
.app{--bg:#F3F6F8;--surface:#FFFFFF;--surface2:#E8EEF2;--text:#17212B;--muted:#56626E;--line:#C9D2DA;--accent:#0B7480;--accent-ink:#FFFFFF;--mine:#0B7480;--mine-ink:#FFFFFF;--c1:#B3261E;--c2:#8A5A00;--c3:#1B7F3B;--c4:#1F5FBF;--c5:#8E3FBF;--c6:#B0306E;position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Noto Sans SC','Noto Sans KR','Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.5}
.app.dark{--bg:#0E1418;--surface:#172028;--surface2:#212C35;--text:#E6EDF2;--muted:#9AA8B4;--line:#2E3B47;--accent:#4CC9D4;--accent-ink:#06262A;--mine:#116069;--mine-ink:#FFFFFF;--c1:#FF8A80;--c2:#F2B94B;--c3:#5FD38A;--c4:#7CAEFF;--c5:#C79BFF;--c6:#FF8FC0}
.app *{box-sizing:border-box}
.app button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.app button:focus-visible,.app textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app svg{display:block;flex:none}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}.c6{color:var(--c6)}
.ibtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.sbtn{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.lang{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:500}
.row{display:flex;flex-direction:column;max-width:60%}
.row.other{align-self:flex-start;align-items:flex-start}
.row.mine{align-self:flex-end;align-items:flex-end}
.meta{display:flex;gap:8px;align-items:baseline;font-size:13px;margin:0 4px 3px}
.name{font-weight:700}
.time{color:var(--muted);font-size:12px}
.bubble{padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.row.other .bubble{border-top-left-radius:6px}
.row.mine .bubble{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-bottom-right-radius:6px}
.bubble a{color:var(--accent);text-decoration:underline}
.sys{align-self:center;color:var(--muted);font-size:13px;padding:2px 12px;text-align:center}
.sys.recalled{font-style:italic}
.card{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:18px;border-top-left-radius:6px;background:var(--surface);border:1px solid var(--line);min-width:280px}
.img{width:280px;height:170px;border-radius:18px;border-top-left-radius:6px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px}
.recall{margin:-4px -8px -8px 0;padding:10px 8px;font-size:13px;color:var(--muted);text-decoration:underline}
.field{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;padding:11px 14px;resize:none}
.field::placeholder{color:var(--muted)}
.person{height:44px;display:flex;align-items:center;gap:10px;padding:0 20px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c3)}
</style>
</helmet>
<div class="app {{theme}}" style="width:1280px;height:820px;display:flex;flex-direction:column">
  <div style="height:40px;display:flex;align-items:flex-end;gap:2px;padding:0 12px;background:var(--surface2);border-bottom:1px solid var(--line)" aria-label="瀏覽器分頁列範例">
    <div style="height:32px;width:240px;padding:0 12px;border-radius:10px 10px 0 0;background:var(--bg);display:flex;align-items:center;gap:8px;font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <span style="flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">(3) 匿名聊天室</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>
  </div>
  <div style="height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted);font-size:12px">示範模式・對話對象為模擬</div>

  <div style="flex:1;min-height:0;display:flex">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative">
      <div style="height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)">
        <h1 style="margin:0;font-size:20px;font-weight:800">匿名聊天室</h1>
        <button class="lang" type="button" aria-label="切換介面語言">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
          <span>繁體中文</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>

      <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:24px">
        <div class="sys">小華 進來了</div>

        <div class="row other">
          <div class="meta"><span class="name c4">小華</span><span class="time">14:30</span></div>
          <button type="button" aria-label="放大圖片">
            <span class="img">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
              <span>圖片・點一下放大</span>
            </span>
          </button>
        </div>

        <div class="row other">
          <div class="meta"><span class="name c5">Amy</span><span class="time">14:32</span></div>
          <div class="card">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;overflow-wrap:anywhere">週末活動資料.pdf</div>
              <div style="font-size:12px;color:var(--muted)">1.2 MB</div>
            </div>
            <button type="button" class="ibtn" style="width:44px;height:44px" aria-label="下載 週末活動資料.pdf">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
            </button>
          </div>
        </div>

        <div class="row other">
          <div class="meta"><span class="name c3">阿傑</span><span class="time">14:34</span></div>
          <div class="bubble">這個活動資訊在這裡 <a href="#">https://example.com/weekend</a></div>
        </div>

        <div class="row mine">
          <div class="meta"><span class="time">14:35</span><span class="name c2">阿森</span></div>
          <div class="bubble">收到，我晚點看一下！</div>
          <button type="button" class="recall">收回</button>
        </div>

        <div class="sys recalled">Amy 收回了一則訊息</div>
        <div class="sys">阿傑 離開了</div>
      </div>

      <button type="button" style="position:absolute;right:24px;bottom:132px;height:44px;padding:0 18px;border-radius:22px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(10,20,30,.3)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        有 3 則新訊息
      </button>

      <div style="height:28px;padding:0 24px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px">
        <svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><circle cx="3" cy="4" r="2.5" fill="currentColor"/><circle cx="11" cy="4" r="2.5" fill="currentColor" opacity=".65"/><circle cx="19" cy="4" r="2.5" fill="currentColor" opacity=".35"/></svg>
        <span>小華、小美 正在輸入…</span>
      </div>
      <div style="padding:8px 24px 14px;background:var(--surface);border-top:1px solid var(--line)">
        <div style="display:flex;align-items:flex-end;gap:10px">
          <button type="button" class="ibtn" aria-label="附加圖片或檔案">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <label for="msg" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">訊息內容</label>
          <textarea id="msg" class="field" rows="1" placeholder="輸入訊息…"></textarea>
          <button type="button" class="sbtn" aria-label="送出訊息">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>
        <div style="margin:6px 0 0 58px;font-size:12px;color:var(--muted)">Enter 送出・Shift + Enter 換行</div>
      </div>
    </div>

    <aside aria-label="線上名單" style="width:280px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column">
      <div style="height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:800">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        線上 4 人
      </div>
      <div style="padding:8px 0">
        <div class="person"><span class="dot"></span><span class="c2">阿森</span><span style="color:var(--muted);font-weight:500">（你）</span></div>
        <div class="person"><span class="dot"></span><span class="c4">小華</span></div>
        <div class="person"><span class="dot"></span><span class="c5">Amy</span></div>
        <div class="person"><span class="dot"></span><span class="c6">小美</span></div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"外觀"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
return { theme: dark ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
